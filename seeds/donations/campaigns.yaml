      - { languages_code: de, slug: "som-save-our-mosque", name: "SOM – Save Our Mosque", description: "<p>Mit dieser Kampagne möchte das Islamische Zentrum Regensburg (IZR) das gesamte Grundstück der Rahman-Moschee kaufen und den Standort dauerhaft sichern. Kaufsumme: 1.200.000 €, Zeitrahmen: 12 Monate.</p>" , screen_summary: '<p>Das IZR möchte das gesamte Grundstück der Rahman-Moschee kaufen und den Standort dauerhaft sichern. Kaufsumme: 1.200.000 €, Zeitrahmen: 12 Monate.</p>' }
      - { languages_code: en, slug: "som-save-our-mosque", name: "SOM – Save Our Mosque", description: "<p>This campaign by the Islamic Center of Regensburg (IZR) aims to purchase the entire Rahman Mosque property and secure the mosque's location permanently. Amount needed: €1,200,000, target timeframe: 12 months.</p>" , screen_summary: '<p>The IZR aims to purchase the entire Rahman Mosque property and secure the mosque’s location permanently. Amount needed: €1,200,000; target timeframe: 12 months.</p>' }
      - { languages_code: ar, slug: "som-save-our-mosque-ar", name: "SOM – Save Our Mosque | نحافظ على مسجدنا", description: "<p>أطلق المركز الإسلامي في ريغنسبورغ (IZR) هذه الحملة لشراء كامل أرض مسجد الرحمن وتأمين مقر المسجد بشكل دائم. المبلغ المطلوب: 1,200,000 يورو، المدة المستهدفة: 12 شهرًا.</p>" , screen_summary: '<p>يهدف المركز الإسلامي في ريغنسبورغ إلى شراء كامل أرض مسجد الرحمن وتأمين مقر المسجد بشكل دائم. المبلغ المطلوب: 1,200,000 يورو، والمدة المستهدفة: 12 شهراً.</p>' }
