      - { languages_code: de, slug: "freitagsgebet-neue-zeiten-im-winter", title: "Freitagsgebet: neue Zeiten im Winter", body: "<p>Seit der Umstellung auf die Winterzeit beginnt das Freitagsgebet (Jumu'ah) im <strong>Islamischen Zentrum Regensburg</strong> (Alte Straubinger Str. 33) zu neuen Zeiten. Die Chutba halten wir in zwei Sprachen:</p><p><strong>Englisch/Deutsch:</strong> 12:30 Uhr<br><strong>Arabisch:</strong> 13:30 Uhr</p><p>Kommt einfach zu dem Gebet, bei dem ihr die Predigt am besten versteht. Und sagt es bitte in eurer Familie und im Freundeskreis weiter.</p>" , screen_summary: '<p>Seit der Zeitumstellung gilt ein neuer Zeitplan für das Freitagsgebet: Englisch/Deutsch um 12:30 Uhr, Arabisch um 13:30 Uhr.</p>' }
      - { languages_code: en, slug: "friday-prayer-new-winter-times", title: "Friday prayer: new winter times", body: "<p>Since the clocks changed, Friday prayer (Jumu'ah) at the <strong>Islamic Center Regensburg</strong> (Alte Straubinger Str. 33) starts at new times. The khutbah is given in two languages:</p><p><strong>English/German:</strong> 12:30 PM<br><strong>Arabic:</strong> 1:30 PM</p><p>Just come to the prayer where you understand the khutbah best. And please pass this on to your family and friends.</p>" , screen_summary: '<p>Since the clocks changed, Friday prayer at the Islamic Center Regensburg has new times: English/German at 12:30 PM and Arabic at 1:30 PM.</p>' }
      - { languages_code: ar, slug: "salat-aljumuah-mawaeid-alshitaa-aljadida", title: "صلاة الجمعة: مواعيد الشتاء الجديدة", body: "<p>بعد تغيير الساعة إلى التوقيت الشتوي، تغيّرت مواعيد صلاة الجمعة في <strong>المركز الإسلامي في ريغنسبورغ</strong> (Alte Straubinger Str. 33). والخطبة تُلقى بلغتين:</p><p><strong>الإنجليزية والألمانية:</strong> الساعة 12:30 ظهرًا<br><strong>العربية:</strong> الساعة 1:30 ظهرًا</p><p>تعالَ إلى الصلاة التي تفهم خطبتها أكثر، ولا تنسَ أن تخبر أهلك وأصدقاءك.</p>" , screen_summary: '<p>بعد تغيير الساعة، تغيّرت مواعيد صلاة الجمعة في المركز الإسلامي في ريغنسبورغ: الإنجليزية والألمانية الساعة 12:30، والعربية الساعة 13:30.</p>' }
