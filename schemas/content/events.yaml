collection: events
schema: {}
meta:
  icon: event
  note: Mosque event information; no registration.
fields:
  - field: id
    type: uuid
    schema:
      is_primary_key: true
      is_nullable: false
    meta:
      interface: input
      special: [uuid]
      hidden: true
      readonly: true
  - field: translations
    type: alias
    schema: null
    meta:
      interface: translations
      special: [translations]
      options:
        languageField: name
        languageDirectionField: direction
        defaultLanguage: de
  - field: starts_at
    type: timestamp
    schema:
      is_nullable: false
    meta:
      interface: datetime
      required: true
  - field: ends_at
    type: timestamp
    meta:
      interface: datetime
      note: Optional event end time.
  - field: status
    type: string
    schema:
      is_nullable: false
      default_value: draft
    meta:
      interface: select-dropdown
      required: true
      options:
        choices:
          - { text: Draft, value: draft }
          - { text: Published, value: published }
          - { text: Cancelled, value: cancelled }
          - { text: Archived, value: archived }
      validation:
        status:
          _in: [draft, published, cancelled, archived]
  - field: thumbnail
    type: uuid
    schema:
      is_nullable: true
    meta:
      interface: file-image
      special: [file]
      note: Optional thumbnail shown on the event card; falls back to the default background when empty.
relations:
  - field: thumbnail
    related_collection: directus_files
    schema:
      foreign_key_column: id
      on_delete: SET NULL
    meta: {}
