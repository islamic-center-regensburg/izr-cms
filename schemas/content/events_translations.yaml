collection: events_translations
schema: {}
meta:
  hidden: true
  note: Localized event information.
fields:
  - field: id
    type: uuid
    schema:
      is_primary_key: true
      is_nullable: false
    meta:
      interface: input
      special: [uuid]
      hidden: true
      readonly: true
  - field: events_id
    type: uuid
    schema:
      is_nullable: false
    meta:
      interface: select-dropdown-m2o
      special: [m2o]
      hidden: true
  - field: languages_code
    type: string
    schema:
      is_nullable: false
      max_length: 2
    meta:
      interface: select-dropdown-m2o
      special: [m2o]
      hidden: true
  - field: title
    type: string
    schema:
      is_nullable: false
    meta:
      interface: input
      required: true
      hidden: false
      readonly: false
  - field: slug
    type: string
    schema:
      is_nullable: true
    meta:
      interface: input
      required: true
      hidden: false
      readonly: false
      note: "Required URL path segment for this language; lowercase letters, digits, and hyphens only. Must be unique per language; not enforced by the schema."
      validation:
        slug:
          _regex: "^[a-z0-9]+(-[a-z0-9]+)*$"
  - field: description
    type: text
    meta:
      interface: input-rich-text-html
      hidden: false
      readonly: false
  - field: screen_summary
    type: text
    meta:
      interface: input-rich-text-html
      hidden: false
      readonly: false
      note: Optional short, localized summary for mosque screens.
  - field: location
    type: string
    meta:
      interface: input
      hidden: false
      readonly: false
  - field: meta_title
    type: string
    meta:
      interface: input
      hidden: false
      readonly: false
      note: Optional SEO page title; defaults to title when empty.
  - field: meta_description
    type: text
    meta:
      interface: input-multiline
      hidden: false
      readonly: false
      note: Optional SEO meta description.
relations:
  - field: events_id
    related_collection: events
    schema:
      on_delete: CASCADE
    meta:
      one_field: translations
      junction_field: languages_code
      one_deselect_action: delete
  - field: languages_code
    related_collection: languages
    schema:
      on_delete: RESTRICT
    meta:
      one_field: null
      junction_field: events_id
