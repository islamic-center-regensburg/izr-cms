collection: prayer_times
schema: {}
meta:
  icon: schedule
  note: Daily prayer times in the mosque's local timezone.
fields:
  - field: date
    type: date
    schema:
      is_primary_key: true
      is_nullable: false
    meta:
      interface: datetime
      required: true
  - field: hijri
    type: string
    schema:
      is_nullable: false
      max_length: 10
    meta:
      interface: input
      required: true
      note: "Hijri calendar date for this entry, as YYYY-MM-DD (hijri year-month-day)."
      validation:
        hijri:
          _regex: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
  - field: fajr
    type: time
    schema:
      is_nullable: false
    meta:
      interface: datetime
      required: true
  - field: sunrise
    type: time
    schema:
      is_nullable: false
    meta:
      interface: datetime
      required: true
  - field: dhuhr
    type: time
    schema:
      is_nullable: false
    meta:
      interface: datetime
      required: true
  - field: jumuah
    type: time
    meta:
      interface: datetime
      note: Friday's Jumu'ah reference time, used for offset-based iqama times.
  - field: asr
    type: time
    schema:
      is_nullable: false
    meta:
      interface: datetime
      required: true
  - field: maghrib
    type: time
    schema:
      is_nullable: false
    meta:
      interface: datetime
      required: true
  - field: isha
    type: time
    schema:
      is_nullable: false
    meta:
      interface: datetime
      required: true
