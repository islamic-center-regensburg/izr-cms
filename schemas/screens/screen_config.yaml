collection: screen_config
schema: {}
meta:
  icon: settings
  singleton: true
  note: General settings for the mosque's single display.
fields:
  - field: id
    type: uuid
    schema:
      is_primary_key: true
      is_nullable: false
    meta:
      interface: input
      special: [uuid]
      hidden: true
      readonly: true
  - field: timezone
    type: string
    schema:
      is_nullable: false
      default_value: UTC
    meta:
      interface: input
      required: true
      note: IANA timezone, for example Europe/Berlin. Set this to the mosque's timezone.
  - field: languages
    type: csv
    schema:
      is_nullable: false
      default_value: de,en,ar
    meta:
      interface: select-dropdown-multiple
      special: [cast-csv]
      required: true
      options:
        choices:
          - { text: German, value: de }
          - { text: English, value: en }
          - { text: Arabic, value: ar }
      validation:
        languages:
          _nempty: true
  - field: mode
    type: string
    schema:
      is_nullable: false
      default_value: automatic
    meta:
      interface: select-dropdown
      required: true
      options:
        choices:
          - { text: Automatic, value: automatic }
          - { text: Manual, value: manual }
      validation:
        mode:
          _in: [automatic, manual]
  - field: manual_section
    type: uuid
    schema:
      is_nullable: true
    meta:
      interface: select-dropdown-m2o
      special: [m2o]
      conditions:
        - rule:
            mode:
              _neq: manual
          hidden: true
        - rule:
            mode:
              _eq: manual
          hidden: false
          required: true
      required: false
      note: Section shown in manual mode, regardless of its automatic visibility settings.
  - field: manual_language
    type: string
    schema:
      is_nullable: false
      default_value: de
    meta:
      interface: select-dropdown
      required: true
      options:
        choices:
          - { text: German, value: de }
          - { text: English, value: en }
          - { text: Arabic, value: ar }
      conditions:
        - rule:
            mode:
              _neq: manual
          hidden: true
      validation:
        manual_language:
          _in: [de, en, ar]
  - field: orientation
    type: string
    schema:
      is_nullable: false
      default_value: landscape
    meta:
      interface: select-dropdown
      required: true
      options:
        choices:
          - { text: Landscape, value: landscape }
          - { text: Portrait, value: portrait }
      validation:
        orientation:
          _in: [landscape, portrait]
  - field: refresh_interval_seconds
    type: integer
    schema:
      is_nullable: false
      default_value: 60
    meta:
      interface: input
      required: true
      validation:
        refresh_interval_seconds:
          _gte: 1
  - field: show_clock
    type: boolean
    schema:
      is_nullable: false
      default_value: true
    meta:
      interface: boolean
      special: [cast-boolean]
relations:
  - field: manual_section
    related_collection: screen_sections
    schema:
      on_delete: SET NULL
    meta:
      one_field: null
      many_field: manual_section
      one_collection: screen_sections
