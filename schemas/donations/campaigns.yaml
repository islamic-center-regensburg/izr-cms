collection: campaigns
schema: {}
meta:
  icon: volunteer_activism
  note: Mosque fundraising campaigns.
fields:
  - field: id
    type: integer
    schema:
      is_primary_key: true
      has_auto_increment: true
    meta:
      interface: input
      hidden: true
      readonly: true
  - field: translations
    type: alias
    schema: null
    meta:
      interface: translations
      special: [translations]
      options:
        languageField: name
        languageDirectionField: direction
        defaultLanguage: de
  - field: target_amount
    type: decimal
    schema:
      numeric_precision: 12
      numeric_scale: 2
    meta:
      interface: input
      note: Optional fundraising goal in the campaign's currency.
      validation:
        _or:
          - target_amount:
              _null: true
          - target_amount:
              _gt: 0
  - field: currency
    type: string
    schema:
      is_nullable: false
      max_length: 3
      default_value: EUR
    meta:
      interface: input
      required: true
      note: Uppercase ISO 4217 currency code.
      validation:
        currency:
          _regex: "^[A-Z]{3}$"
  - field: starts_at
    type: timestamp
    meta:
      interface: datetime
  - field: ends_at
    type: timestamp
    meta:
      interface: datetime
  - field: status
    type: string
    schema:
      is_nullable: false
      default_value: draft
    meta:
      interface: select-dropdown
      required: true
      options:
        choices:
          - { text: Draft, value: draft }
          - { text: Active, value: active }
          - { text: Completed, value: completed }
          - { text: Archived, value: archived }
      validation:
        status:
          _in: [draft, active, completed, archived]
  - field: thumbnail
    type: uuid
    schema:
      is_nullable: true
    meta:
      interface: file-image
      special: [file]
      note: Optional thumbnail shown on the campaign card; falls back to the default background when empty.
relations:
  - field: thumbnail
    related_collection: directus_files
    schema:
      foreign_key_column: id
      on_delete: SET NULL
    meta: {}
